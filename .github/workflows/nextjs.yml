# CI build check.
#
# This used to build+deploy a static export to GitHub Pages. The site now
# needs SSR (per-request data from api.tixx.im + correct OG tags for
# /events/[id] and /hosts/[id] — see Dockerfile), which GitHub Pages can't
# serve, so that deploy step is gone. This workflow now just verifies the
# app still builds; wire up an actual deploy step (Cloud Run / GCP) here
# once that target is decided.
name: Build check

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
